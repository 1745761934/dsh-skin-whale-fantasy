name: check

on:
  push:
  pull_request:

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 脚本语法
        run: node --check scripts/apply-whale-fantasy.mjs
      - name: 载体自检（括号配平 + 关键规则齐全）
        run: node tests/carrier.test.mjs
